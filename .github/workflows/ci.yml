name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  php:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint every PHP file
        run: |
          php -v
          files=$(git ls-files '*.php')
          test -n "$files" || { echo "no PHP files found"; exit 1; }
          status=0
          for f in $files; do php -l "$f" || status=1; done
          exit $status
